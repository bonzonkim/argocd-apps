apiVersion: apps/v1
kind: Deployment
metadata:
  name: running-mate-api
  namespace: running-mate
  labels:
    app.kubernetes.io/name: running-mate-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: running-mate-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: running-mate-api
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: running-mate-packages
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/bonzonkim/running-mate-api:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: running-mate-api-database
                  key: uri
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: running-mate-api-secret
                  key: JWT_SIGNING_KEY
            - name: REFRESH_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: running-mate-api-secret
                  key: REFRESH_TOKEN_PEPPER
          envFrom:
            - configMapRef:
                name: running-mate-api-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
