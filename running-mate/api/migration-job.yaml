apiVersion: batch/v1
kind: Job
metadata:
  name: running-mate-api-migrate
  namespace: running-mate
  labels:
    app.kubernetes.io/name: running-mate-api
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: running-mate-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/bonzonkim/running-mate-api:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["/migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: running-mate-postgresql-app
                  key: uri
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: running-mate-api-secret
                  key: JWT_SIGNING_KEY
            - name: REFRESH_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: running-mate-api-secret
                  key: REFRESH_TOKEN_PEPPER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
