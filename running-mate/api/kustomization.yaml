apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# config.json is consumed only by the ApplicationSet generator. Listing the
# Kubernetes resources explicitly keeps it out of Argo CD's manifest stream.
resources:
  - configmap.yaml
  - certificate.yaml
  - service.yaml
  - ingress.yaml
  - migration-job.yaml
  - deployment.yaml
