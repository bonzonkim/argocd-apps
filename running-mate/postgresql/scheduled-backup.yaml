apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: running-mate-daily
  namespace: running-mate
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: running-mate-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
