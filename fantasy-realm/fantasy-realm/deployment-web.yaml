apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-realm-web-deployment
  namespace: fantasy-realm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-realm-web
  template:
    metadata:
      labels:
        app: fantasy-realm-web
    spec:
      containers:
        - name: fantasy-realm-web
          image: ghcr.io/bonzonkim/fantasy-realm/fantasy-realm:1.0.1
          imagePullPolicy: Always
          command:
            - ./apps/web/node_modules/.bin/next
          args:
            - start
            - -H
            - 0.0.0.0
            - -p
            - "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      imagePullSecrets:
        - name: fantasy-realm-packages
