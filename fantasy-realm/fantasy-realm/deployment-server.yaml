apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-realm-server-deployment
  namespace: fantasy-realm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-realm-server
  template:
    metadata:
      labels:
        app: fantasy-realm-server
    spec:
      containers:
        - name: fantasy-realm-server
          image: ghcr.io/bonzonkim/fantasy-realm/fantasy-realm:1.0.0
          imagePullPolicy: Always
          command:
            - pnpm
          args:
            - start:server
          env:
            - name: PORT
              value: "3001"
            - name: WEB_ORIGIN
              value: "https://fr.k8s.bumgu.com"
            - name: REDIS_URL
              value: "redis://fantasy-realm-redis-service:6379"
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      imagePullSecrets:
        - name: fantasy-realm-packages
