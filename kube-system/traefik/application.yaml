apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  labels:
    source-type: raw
spec:
  project: default
  source:
    repoURL: https://github.com/bonzonkim/argocd-apps
    targetRevision: main
    path: kube-system/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
